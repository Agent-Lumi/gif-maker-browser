<script>
// Auto-save to localStorage
const saveKey = 'app-data-' + location.pathname;
const saveData = () => {
    const data = { timestamp: Date.now(), inputs: {} };
    document.querySelectorAll('input, textarea').forEach(el => {
        data.inputs[el.id || el.name] = el.value;
    });
    localStorage.setItem(saveKey, JSON.stringify(data));
};
const loadData = () => {
    const saved = localStorage.getItem(saveKey);
    if (saved) {
        const data = JSON.parse(saved);
        Object.entries(data.inputs).forEach(([key, value]) => {
            const el = document.getElementById(key) || document.querySelector('[name="' + key + '"]');
            if (el) el.value = value;
        });
    }
};
document.addEventListener('input', saveData);
document.addEventListener('DOMContentLoaded', loadData);
</script>
<script>
// Export functionality
function exportData(format) {
    const data = document.querySelector('textarea, input')?.value || document.body.innerText;
    const blob = new Blob([data], { type: 'text/plain' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'export.' + format;
    a.click();
    URL.revokeObjectURL(url);
}
</script>

<script>

importBtn.textContent = '📁 Import';
importBtn.onclick = () => {
    const input = document.createElement('input');
    input.type = 'file';

<script>
// Simple tutorial
const tutorialSteps = [
    { selector: 'h1', text: 'Welcome! This is the main title.' },
    { selector: 'button', text: 'Click here to perform actions.' }
];
let currentStep = 0;
function showTutorial() {
    if (currentStep < tutorialSteps.length) {
        const step = tutorialSteps[currentStep];
        const el = document.querySelector(step.selector);
        if (el) {
            const tooltip = document.createElement('div');
            tooltip.textContent = step.text;
            tooltip.style.cssText = 'position:absolute;background:#6f42c1;color:white;padding:10px;border-radius:5px;z-index:1000;';
            el.style.position = 'relative';
            el.appendChild(tooltip);
            setTimeout(() => tooltip.remove(), 3000);
        }
        currentStep++;
    }
}
// Show tutorial on first visit
if (!localStorage.getItem('tutorial-shown')) {
    setTimeout(showTutorial, 1000);
    localStorage.setItem('tutorial-shown', 'true');
}
</script>

<script>
// Undo/Redo history
const history = { past: [], future: [] };
const saveState = () => {
    const state = document.querySelector('textarea, input')?.value;
    if (state) history.past.push(state);
};
document.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'z') {
        e.preventDefault();
        if (e.shiftKey && history.future.length) {
            // Redo
            const state = history.future.pop();
            history.past.push(document.querySelector('textarea, input')?.value);
            if (document.querySelector('textarea, input')) document.querySelector('textarea, input').value = state;
        } else if (history.past.length) {
            // Undo
            const state = history.past.pop();
            history.future.push(document.querySelector('textarea, input')?.value);
            if (document.querySelector('textarea, input')) document.querySelector('textarea, input').value = state;
        }
    }
});
document.addEventListener('input', saveState);
</script>

        <li><kbd>Ctrl+?</kbd> - Show this help</li>
        <li><kbd>Space</kbd> - Play/Pause preview</li>
        <li><kbd>Esc</kbd> - Close modals</li>
    </ul>
    <button onclick="document.getElementById('keyboard-shortcuts-help').style.display='none'" style="margin-top:10px;padding:8px 16px;background:#6f42c1;color:#fff;border:none;border-radius:5px;cursor:pointer;">Close</button>

    bottom: 20px;
    left: 20px;

    color: white;
    padding: 8px 12px;
    border-radius: 20px;

<script>
// Keyboard shortcuts handler
document.addEventListener('keydown', function(e) {
    const helpModal = document.getElementById('keyboard-shortcuts-help');
    
    // Show help with Ctrl+?
    if ((e.ctrlKey || e.metaKey) && e.key === '?') {
        e.preventDefault();
        helpModal.style.display = helpModal.style.display === 'none' ? 'block' : 'none';
        return;
    }
    
    // Close modals with Escape
    if (e.key === 'Escape') {
        helpModal.style.display = 'none';
        return;
    }
    
    // Ctrl/Cmd shortcuts
    if (e.ctrlKey || e.metaKey) {
        switch(e.key.toLowerCase()) {
            case 's':
                e.preventDefault();
                // Trigger save/download if available
                const downloadBtn = document.querySelector('button[download], a[download]');
                if (downloadBtn) downloadBtn.click();
                console.log('🎹 Shortcut: Save GIF triggered');
                break;
            case 'r':
                e.preventDefault();
                // Reset/clear
                const fileInput = document.querySelector('input[type="file"]');
                if (fileInput) {
                    fileInput.value = '';
                    fileInput.dispatchEvent(new Event('change'));
                }
                console.log('🎹 Shortcut: Reset triggered');
                break;
            case 'f':
                e.preventDefault();
                // Focus file input
                const input = document.querySelector('input[type="file"]');
                if (input) input.click();
                console.log('🎹 Shortcut: Focus file input');
                break;
        }
    }
    
    // Space for play/pause
    if (e.code === 'Space' && e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') {
        e.preventDefault();
        console.log('🎹 Shortcut: Play/Pause');
    }
});

// Add help button
document.addEventListener('DOMContentLoaded', function() {
    const hint = document.createElement('div');
    hint.className = 'shortcut-hint';
    hint.innerHTML = '⌨️ Press <kbd>Ctrl+?</kbd> for shortcuts';
    hint.onclick = function() {
        document.getElementById('keyboard-shortcuts-help').style.display = 'block';
    };
    document.body.appendChild(hint);
    
    // Auto-hide hint after 5 seconds
    setTimeout(function() {
        hint.style.opacity = '0';
        setTimeout(function() {
            hint.style.display = 'none';
        }, 500);
    }, 5000);
});
</script>
<!-- End Keyboard Shortcuts -->
